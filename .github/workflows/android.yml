# Pina XR - build do APK via GitHub Actions.
#
# O Cardboard SDK vem do submódulo git (cardboard/), o modelo do MediaPipe é
# baixado pelo task downloadHandModel e a lib nativa do Cardboard é extraída
# pelo task extractNdk (tudo automático no fluxo Gradle).

name: Build APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Gradle (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout (com submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1 (com cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Show toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true

      - name: Build (debug + release)
        run: gradle assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Upload APKs (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: pina-xr-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Resumo
        run: |
          echo "## APKs gerados 🍍" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/ || true

  emulator-test:
    name: "Emulador: app vivo por 12s"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - name: Checkout (com submodulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Patch ABIs (x86_64 p/ emulador - so neste job)
        run: |
          sed -i "s/abiFilters 'arm64-v8a'/abiFilters 'arm64-v8a', 'x86_64'/" app/build.gradle
          sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a'/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'/" cardboard/sdk/build.gradle
          grep -n "abiFilters" app/build.gradle cardboard/sdk/build.gradle

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: KVM pronto
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Abre o app no emulador e observa por 13s+
        timeout-minutes: 30
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager "system-images;android-30;google_apis;x86_64" > /dev/null
          echo no | avdmanager create avd -n pina-teste -k "system-images;android-30;google_apis;x86_64" -d pixel_5
          emulator -avd pina-teste -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-front emulated -camera-back emulated -accel on &
          adb wait-for-device
          BOOT=0
          for i in $(seq 1 120); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOT" = "1" ] && break
            sleep 3
          done
          if [ "$BOOT" != "1" ]; then echo "emulador nao bootou"; exit 1; fi
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell pm grant com.pina.xr android.permission.CAMERA || true
          adb shell pm grant com.pina.xr android.permission.READ_EXTERNAL_STORAGE || true
          adb logcat -c
          adb shell am start -W -n com.pina.xr/.PinaActivity
          sleep 6
          adb shell input tap 400 400 || true   # botao do visor (toque na tela)
          sleep 7
          PID=$(adb shell pidof com.pina.xr | tr -d '\r' || true)
          echo "PID depois de 13s+ rodando: [$PID]"
          adb logcat -d > logcat-completo.txt || true
          adb logcat -d -s PinaActivity:V PinaCamera:V HandTracking:V PinaVideo:V PinaCrash:V AndroidRuntime:E > logcat-app.txt || true
          if [ -z "$PID" ]; then
            echo "!!! APP MORREU - fim do logcat:"
            tail -150 logcat-completo.txt
            exit 1
          fi
          echo "APP VIVO por 13s+ no emulador"

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: |
            logcat-completo.txt
            logcat-app.txt
          if-no-files-found: ignore
          retention-days: 14
