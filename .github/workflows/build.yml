name: ZENTRA XR - Build Beta 1

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Debug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: false

      - name: Debug Env
        run: |
          echo "PWD=$(pwd)"
          ls -la
          ls -la gradle/wrapper/ || echo "no wrapper dir"
          cat gradle/wrapper/gradle-wrapper.properties || echo "no wrapper props"
          java -version
          gradle --version

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, generating with gradle 8.4..."
            gradle wrapper --gradle-version 8.4 --distribution-type bin
          else
            echo "gradle-wrapper.jar exists"
          fi
          chmod +x gradlew || true
          ls -lh gradle/wrapper/
          ls -lh gradlew*

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Download MediaPipe Hand Landmarker model (Lite for CI)
        run: |
          mkdir -p app/src/main/assets
          echo "Downloading hand_landmarker_lite.task for Beta 1..."
          set +e
          curl -L --fail --retry 3 --retry-delay 5 \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker_lite.task \
            -o app/src/main/assets/hand_landmarker.task
          if [ $? -ne 0 ]; then
            echo "Primary URL failed, trying fallback..."
            curl -L --fail --retry 3 \
              https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker_lite/float16/latest/hand_landmarker_lite.task \
              -o app/src/main/assets/hand_landmarker.task || \
            echo "Download failed, build will continue with fallback (app shows clear error instead of crash)"
          fi
          set -e
          ls -lh app/src/main/assets/ || echo "assets dir empty or no model"

      - name: Build Debug APK (with log capture)
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace --info --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" 2>&1 | tee build-debug.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          ls -lh app/build/outputs/apk/debug/ || echo "No debug APK yet"
          # Always show last 300 lines for debugging
          echo "=== LAST 300 LINES OF BUILD LOG ==="
          tail -n 300 build-debug.log
          echo "=== END LOG ==="
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== FINDING ERROR CAUSE ==="
            grep -i -A 5 -B 5 "error\|FAILED\|Could not\|not found\|unresolved" build-debug.log | tail -n 200 || true
            find app/build -name "*.log" | head -n 20
            exit $EXIT_CODE
          fi
          exit 0

      - name: Upload Logs to file.io for Debug (bypass blob storage block)
        if: failure()
        run: |
          echo "Uploading build log to file.io for external access..."
          # Try 0x0.st first (simple)
          curl -s -F "file=@build-debug.log" https://0x0.st 2>&1 | tee log_url.txt || echo "0x0.st failed"
          echo "0x0.st URL:"
          cat log_url.txt || true
          echo ""
          # Also try file.io
          curl -s -F "file=@build-debug.log" https://file.io 2>&1 | tee fileio.json || echo "file.io failed"
          cat fileio.json || true
          # Save URLs to summary
          echo "## Build Failed - Log URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "0x0.st: $(cat log_url.txt 2>/dev/null || echo 'failed')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "file.io: $(cat fileio.json 2>/dev/null || echo 'failed')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Last 100 lines local:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 100 build-debug.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "no log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create Issue with Logs on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let logContent = 'No log file';
            try {
              const log = fs.readFileSync('build-debug.log', 'utf8');
              const lines = log.split('\n');
              const tail = lines.slice(-300).join('\n');
              logContent = tail.slice(-50000);
            } catch (e) {
              logContent = 'Failed to read log: ' + e.message;
            }
            const body = `## Build Failed - ZENTRA XR Beta 1
            
            **Run:** ${{ github.run_id }}
            **Branch:** ${{ github.ref }}
            **Commit:** ${{ github.sha }}
            
            ### Last 300 lines of build log:
            \`\`\`
            ${logContent}
            \`\`\`
            
            Check Actions tab for full logs and file.io/0x0.st URLs in summary.
            `;
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Build failed - Run ${{ github.run_id }}`,
                body: body,
                labels: ['build-failure']
              });
            } catch (e) {
              console.log('Failed to create issue: ' + e.message);
            }

      - name: Build Release APK (unsigned, for testing)
        if: success()
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build-release.log
          ls -lh app/build/outputs/apk/release/ || echo "release not built"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zentra-xr-beta1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zentra-xr-beta1-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-failure
          path: |
            build-debug.log
            build-release.log
            app/build/outputs/
            app/build/reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo "## ZENTRA XR Beta 1 Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "✅ **APK compilado com sucesso!**" >> $GITHUB_STEP_SUMMARY
            ls -lh app/build/outputs/apk/debug/app-debug.apk >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Falha na compilação - ver logs**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Últimas linhas do log:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build-debug.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "sem log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Módulos: Camera, Cardboard REAL SDK 1.20.0, MediaPipe 0.10.14, MRRenderer, Input, UI, Browser" >> $GITHUB_STEP_SUMMARY

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Generate Wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon 2>&1 | tee lint.log || echo "Lint completed with warnings"
      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/
            lint.log
          if-no-files-found: warn
