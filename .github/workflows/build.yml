name: PINA VR - Build APK + Web

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web - PINA VR OS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JS Syntax
        working-directory: web
        run: |
          for f in src/**/*.js src/*.js; do
            node --check "$f" || (echo "FAIL $f" && exit 1)
          done
      - name: Build Web
        working-directory: web
        run: |
          npm install || true
          npm run build || true
      - uses: actions/upload-artifact@v4
        with:
          name: pina-vr-web
          path: web/
          retention-days: 30

  build-android:
    name: Build Android APK - Camera2 API
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Copy Web to Assets
        run: |
          mkdir -p android/app/src/main/assets/pina
          cp -r web/* android/app/src/main/assets/pina/ || true
          mkdir -p android/app/src/main/assets
          touch android/app/src/main/assets/hand_landmarker.task
      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew --version
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
          echo "Exit: ${PIPESTATUS[0]}"
          tail -n 1000 /tmp/build.log
          # Save error summary
          grep -i -A 10 "error" /tmp/build.log | head -n 200 > /tmp/error-summary.txt || true
          cat /tmp/error-summary.txt
          exit ${PIPESTATUS[0]}

      - name: Upload log to paste.rs on failure
        if: failure()
        run: |
          echo "=== Uploading build log to paste.rs ==="
          # Try to upload full log
          URL=$(cat /tmp/build.log | tail -n 2000 | curl -s --data-binary @- https://paste.rs || echo "failed")
          echo "Log URL: $URL"
          echo "Log URL: $URL" >> $GITHUB_STEP_SUMMARY
          echo "### Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo "Paste URL: $URL" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 500 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Also try file.io
          curl -F "file=@/tmp/build.log" https://file.io 2>&1 | head -n 20 || true
          # Save error summary to summary
          echo "### Error Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/error-summary.txt 2>&1 | head -n 200 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: List APKs
        if: always()
        run: |
          find android -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK"
          ls -lh android/app/build/outputs/apk/debug/ 2>&1 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pina-vr-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-logs
          path: |
            /tmp/build.log
            /tmp/error-summary.txt
          retention-days: 7
          if-no-files-found: warn

  build-all:
    name: Summary
    runs-on: ubuntu-latest
    needs: [build-web, build-android]
    if: always()
    steps:
      - run: |
          echo "### PINA VR OS - Build Completo" >> $GITHUB_STEP_SUMMARY
          echo "- Camera2 API + Gyro + Cardboard + 6DOF" >> $GITHUB_STEP_SUMMARY
