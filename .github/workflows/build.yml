name: PINA VR - Build APK + Web

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web - PINA VR OS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JS Syntax
        working-directory: web
        run: |
          echo "=== Checking JS syntax ==="
          for f in src/**/*.js src/*.js; do
            echo "Checking $f"
            node --check "$f" && echo "OK $f" || (echo "FAIL $f" && exit 1)
          done
          echo "All JS syntax OK"

      - name: Build Web
        working-directory: web
        run: |
          echo "=== PINA VR Web Build ==="
          ls -la
          if [ -f package.json ]; then
            npm install || echo "npm install falhou, continuando"
            npm run build || echo "vite build falhou, usando arquivos estáticos"
          fi
          ls -R src || true

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pina-vr-web
          path: web/
          retention-days: 30

  build-android:
    name: Build Android APK - Camera2 API
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Listing SDK..."
          ls -la $ANDROID_HOME || true
          ls -la $ANDROID_HOME/cmdline-tools/ || true
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # Install required packages
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          # Also try older build-tools as fallback
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" || true
          echo "SDK setup done"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list | grep -E "build-tools|platforms;android-34" | head -n 20 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Copy Web to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/pina
          cp -r web/* android/app/src/main/assets/pina/ || true
          mkdir -p android/app/src/main/assets
          touch android/app/src/main/assets/hand_landmarker.task
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties
          ls -lh android/app/src/main/assets/pina/ | head -n 20

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Check Kotlin Syntax (basic)
        working-directory: android
        run: |
          echo "=== Checking Kotlin files exist ==="
          find app/src/main/java -name "*.kt" | xargs ls -lh
          echo "=== Checking for obvious syntax errors ==="
          # Simple grep for common issues
          grep -n "import android" app/src/main/java/com/pinavr/os/camera/Camera2Manager.kt | head -n 20
          echo "Kotlin files look OK"

      - name: Build Debug APK
        working-directory: android
        run: |
          echo "=== Building Debug APK ==="
          ./gradlew --version
          echo "--- Gradle properties ---"
          cat gradle.properties || true
          echo "--- local.properties ---"
          cat local.properties || true
          echo "--- Attempting build ---"
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Exit code: $EXIT_CODE"
          echo "--- Tail log ---"
          tail -n 300 /tmp/build.log
          # Also save to summary
          echo "### Build Log Tail" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 500 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $EXIT_CODE

      - name: List APKs
        if: always()
        run: |
          find android -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK"
          ls -lh android/app/build/outputs/apk/debug/ 2>&1 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pina-vr-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-logs
          path: |
            /tmp/build.log
            android/app/build/reports/
            android/app/build/outputs/
          retention-days: 7
          if-no-files-found: warn

  build-all:
    name: Summary
    runs-on: ubuntu-latest
    needs: [build-web, build-android]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "### PINA VR OS - Build Completo" >> $GITHUB_STEP_SUMMARY
          echo "- Camera2 API traseira 1080p60 + frontal 480p60" >> $GITHUB_STEP_SUMMARY
          echo "- Giroscópio + Acelerômetro 200Hz + 1000Hz interp" >> $GITHUB_STEP_SUMMARY
          echo "- Cardboard + Touch 6DOF + Browser 3D + Pina Saber" >> $GITHUB_STEP_SUMMARY
