name: ZENTRA XR - Build Beta 1

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.4 (for wrapper generation)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper if missing
        run: |
          ls -la gradle/wrapper/
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing, generating..."
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew
          ls -lh gradle/wrapper/

      - name: Download MediaPipe Hand Landmarker model (Lite for CI)
        run: |
          mkdir -p app/src/main/assets
          echo "Downloading hand_landmarker_lite.task for Beta 1..."
          # Try primary URL
          curl -L --fail --retry 3 --retry-delay 5 \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker_lite.task \
            -o app/src/main/assets/hand_landmarker.task || \
          curl -L --fail --retry 3 \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker_lite/float16/latest/hand_landmarker_lite.task \
            -o app/src/main/assets/hand_landmarker.task || \
          echo "Download failed, build will continue with fallback (app shows clear error instead of crash)"
          
          ls -lh app/src/main/assets/ || echo "assets dir empty"

      - name: Cache MediaPipe model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/hand_landmarker.task
          key: hand-landmarker-lite-${{ hashFiles('app/src/main/assets/README_HAND_TRACKING.md') }}

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"
          echo "APK build finished"
          ls -lh app/build/outputs/apk/debug/

      - name: Build Release APK (unsigned, for testing)
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon
          ls -lh app/build/outputs/apk/release/ || echo "release not built"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zentra-xr-beta1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zentra-xr-beta1-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          echo "## ZENTRA XR Beta 1 Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Módulos compilados:**" >> $GITHUB_STEP_SUMMARY
          echo "- Camera (CameraX low latency)" >> $GITHUB_STEP_SUMMARY
          echo "- Cardboard REAL SDK 1.20.0" >> $GITHUB_STEP_SUMMARY
          echo "- HandTracking MediaPipe 0.10.14" >> $GITHUB_STEP_SUMMARY
          echo "- MRRenderer OpenGL ES" >> $GITHUB_STEP_SUMMARY
          echo "- Input Pointer+Pinch" >> $GITHUB_STEP_SUMMARY
          echo "- UI Spatial + Browser" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **APK:** app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/ >> $GITHUB_STEP_SUMMARY || true

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Generate Wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew
      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon || echo "Lint completed with warnings"
      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
