name: PINA VR - Build APK + Web

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web - PINA VR OS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JS Syntax
        working-directory: web
        run: |
          for f in src/**/*.js src/*.js; do
            node --check "$f" && echo "OK $f" || (echo "FAIL $f" && exit 1)
          done

      - name: Build Web
        working-directory: web
        run: |
          ls -la
          if [ -f package.json ]; then
            npm install || true
            npm run build || true
          fi

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pina-vr-web
          path: web/
          retention-days: 30

  build-android:
    name: Build Android APK - Camera2 API
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Copy Web to Assets
        run: |
          mkdir -p android/app/src/main/assets/pina
          cp -r web/* android/app/src/main/assets/pina/ || true
          mkdir -p android/app/src/main/assets
          touch android/app/src/main/assets/hand_landmarker.task
          ls -lh android/app/src/main/assets/pina/ | head -n 20

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Build Debug APK - with full log capture
        working-directory: android
        run: |
          echo "=== Building Debug APK ==="
          ./gradlew --version
          # Try to build and capture full log
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Exit code: $EXIT_CODE"
          # Save log to file in repo for debugging (will be committed if fails)
          cp /tmp/build.log $GITHUB_WORKSPACE/build-failure.log || true
          tail -n 500 /tmp/build.log
          # Also output to summary
          echo "### Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 1000 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Create annotation with error
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Gradle build failed with exit $EXIT_CODE - see logs"
            # Extract error lines
            grep -i "error" /tmp/build.log | head -n 50 | while read line; do
              echo "::error::$line"
            done
          fi
          exit $EXIT_CODE

      - name: Upload log to repo on failure (for debugging)
        if: failure()
        run: |
          echo "=== Uploading log to repo branch ==="
          git config --global user.email "pina-vr@github.com"
          git config --global user.name "PINA VR Bot"
          # Create or checkout build-logs branch
          git fetch origin build-logs:build-logs 2>&1 || git checkout -b build-logs || true
          git checkout build-logs 2>&1 || git checkout -b build-logs
          cp /tmp/build.log ./last-build-failure.log || true
          echo "# Build failure log" > ./README.md
          echo "Run $GITHUB_RUN_ID" >> ./README.md
          echo '```' >> ./README.md
          tail -n 1000 /tmp/build.log >> ./README.md || true
          echo '```' >> ./README.md
          git add last-build-failure.log README.md || true
          git commit -m "Build failure log for run $GITHUB_RUN_ID" || true
          git push origin build-logs --force || true
          echo "Log pushed to build-logs branch"

      - name: List APKs
        if: always()
        run: |
          find android -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK"
          ls -lh android/app/build/outputs/apk/debug/ 2>&1 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pina-vr-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-logs
          path: |
            /tmp/build.log
            build-failure.log
            android/app/build/reports/
          retention-days: 7
          if-no-files-found: warn

  build-all:
    name: Summary
    runs-on: ubuntu-latest
    needs: [build-web, build-android]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "### PINA VR OS - Build Completo" >> $GITHUB_STEP_SUMMARY
          echo "- Camera2 API + Gyro + Cardboard + 6DOF + Browser 3D + Pina Saber" >> $GITHUB_STEP_SUMMARY
