apply plugin: 'com.android.application'

android {
    namespace = 'com.pina.xr'
    compileSdk = 35
    // Mesmo NDK do Cardboard SDK v1.35.0 (instalado automaticamente).
    ndkVersion = '29.0.14206865'

    defaultConfig {
        applicationId 'com.pina.xr'
        // Cardboard SDK + MediaPipe: minSdk 26.
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName '0.1.0-beta'
        ndk {
            // arm64 e o padrao em celulares usados com Cardboard hoje.
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild.cmake {
            arguments '-DANDROID_STL=c++_shared'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Beta: assina o release com a chave debug para o APK ser
            // instalavel direto. Troque por um keystore proprio antes de
            // publicar na Play Store.
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild.cmake {
        path 'CMakeLists.txt'
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Hand tracking (esqueleto da mao) - MediaPipe Tasks Vision.
    implementation 'com.google.mediapipe:tasks-vision:0.10.29'
    // Cardboard SDK oficial (distortion, 3DOF, QR do visor).
    implementation project(':sdk')
}

// ============================================================================
// Baixa o modelo hand_landmarker.task do MediaPipe para assets/ (precisa de
// internet na primeira build). O arquivo nao vai para o git (e binario, ~8MB).
// ============================================================================
def handModelUrl = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
def handModelFile = file('src/main/assets/hand_landmarker.task')

tasks.register('downloadHandModel') {
    doLast {
        if (!handModelFile.exists()) {
            handModelFile.parentFile.mkdirs()
            println "Baixando modelo MediaPipe hand_landmarker.task..."
            def tmp = new File(handModelFile.parentFile, 'hand_landmarker.task.tmp')
            new URL(handModelUrl).withInputStream { i ->
                tmp.withOutputStream { it << i }
            }
            if (tmp.length() < 1024 * 1024) {
                tmp.delete()
                throw new GradleException('Download do modelo hand_landmarker falhou. Rode de novo com internet.')
            }
            tmp.renameTo(handModelFile)
        }
    }
}

// ============================================================================
// Extrai do AAR do :sdk a lib nativa libGfxPluginCardboard.so e o header
// cardboard.h (mesmo fluxo do sample oficial hellocardboard-android).
// ============================================================================
tasks.register('extractNdk') {
    dependsOn ':sdk:assembleRelease'
    dependsOn 'downloadHandModel'
    doLast {
        copy {
            from zipTree("${project.rootDir}/cardboard/sdk/build/outputs/aar/sdk-release.aar")
            into 'libraries/'
            include 'jni/**/libGfxPluginCardboard.so'
        }
        copy {
            from "${project.rootDir}/cardboard/sdk/include/cardboard.h"
            into 'libraries/'
        }
    }
}

preBuild.dependsOn extractNdk
